<style>:root{--ink:#183044;--muted:#526779;--bg:#edf3f8;--line:#c9d8e4;--accent:#146c80}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.85 system-ui,-apple-system,"PingFang TC",sans-serif}.wrap{max-width:1000px;margin:32px auto;padding:28px;background:white;border:1px solid var(--line);border-radius:8px}h1,h2{font-family:"Songti TC",serif;line-height:1.4}h1{font-size:2.3rem}h2{margin-top:2rem;padding-top:1rem;border-top:1px solid var(--line)}a{color:var(--accent);text-underline-offset:.2em}pre{background:var(--ink);color:#e5f1f7;padding:18px;overflow:auto}code{font:13px/1.6 ui-monospace,monospace}.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--bg)}li{margin:.5rem 0}:focus-visible{outline:3px solid #b57814;outline-offset:3px}.intro{background:#e4f0f3;border-left:4px solid var(--accent);padding:16px}@media(max-width:650px){.wrap{margin:0;border:0;border-radius:0;padding:20px 16px}h1{font-size:1.9rem}}</style>
